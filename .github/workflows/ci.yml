name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  # Never let a stray DATABASE_URL / REDIS_URL from the runner reach the app;
  # every job below talks to its own service containers.
  DATABASE_URL: ""
  REDIS_URL: ""

jobs:
  lint:
    name: Lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy app

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]" bandit pip-audit
      - name: pip-audit (known CVEs in installed dependencies)
        run: pip-audit --skip-editable
      # App code must stay free of medium+ findings. scripts/ is held to high
      # only: its xlsx import is admin-only, disabled in production, and its
      # medium findings are triaged in security-audit/SECURITY_REMEDIATION_REPORT.md.
      - name: bandit (app, medium and above)
        run: bandit -q -r app --severity-level medium
      - name: bandit (scripts, high)
        run: bandit -q -r scripts --severity-level high

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # conftest refuses any database whose name does not end in _test.
          POSTGRES_DB: ignition_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ignition_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ignition_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # pyproject's addopts suppress the summary line; -rfE lists each failure
      # and error by name, so a red run is readable straight from the log.
      - run: pytest -rfE

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ignition_migrations_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ignition_migrations_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ENVIRONMENT: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: ignition_migrations_test
      DB_USER: postgres
      DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Upgrade to head
        run: alembic upgrade head
      # Models and migrations must describe the same schema: the test suite
      # builds its tables from the models, production from the migrations.
      - name: No drift between models and migrations
        run: alembic check
      - name: Downgrade to base
        run: alembic downgrade base
      - name: Upgrade to head again
        run: alembic upgrade head
