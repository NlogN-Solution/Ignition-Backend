[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ignition-backend"
version = "0.1.0"
description = "Ignition — single-tenant education platform backend (staff CRM + student portal)"
requires-python = ">=3.12"

# Versions are pinned to match ED360's requirements.txt exactly, so the Phase 1
# port stays a mechanical copy rather than a copy plus a dependency upgrade.
# Upgrades are a separate, deliberate task — see README "Deferred decisions".
dependencies = [
    "fastapi==0.141.1",
    "starlette==1.3.1",
    "uvicorn==0.52.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.7.1",
    "SQLAlchemy==2.0.51",
    "alembic==1.18.5",
    "asyncpg==0.31.0",          # app runtime (async)
    "psycopg[binary]==3.3.4",   # alembic (sync)
    "PyJWT==2.13.0",
    # No passlib: 1.7.4 (its final release, 2020) is incompatible with bcrypt
    # >= 4.1 and raises on every hash. core/security.py calls bcrypt directly.
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    "python-dotenv==1.2.2",
    "email-validator==2.3.0",
    "redis==5.2.1",
    "celery==5.4.0",
    "slowapi==0.1.9",
    "cloudinary==1.46.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    # 1.x is required, not incidental: only 1.0+ supports
    # asyncio_default_test_loop_scope, without which the session-scoped engine
    # fixture and the tests end up on different event loops (see conftest).
    "pytest-asyncio==1.4.0",
    "pytest-cov==6.0.0",
    "httpx==0.28.1",
    "ruff==0.9.2",
    "mypy==1.14.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 120
target-version = "py312"
# Alembic boilerplate and generated revisions: not ours to style.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # comprehensions
    "SIM",      # simplify
]
# Deliberately NOT selecting TID: ED360's 13.5k LOC uses parent-relative imports
# (`from ..models import User`) throughout, and Phase 1 ports it mechanically.
# Banning them would turn a copy into a rewrite of every import in every file.
# The architectural guard TID was carrying lives in tests/test_no_multitenancy.py.
ignore = [
    "B008",  # function call in default arg — this is how FastAPI's Depends() works
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = false   # tightened per-module as Phase 1 modules land
ignore_missing_imports = true
exclude = ["migrations/", "tests/"]

[[tool.mypy.overrides]]
module = ["app.core.*", "app.db.*"]
disallow_untyped_defs = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
# Both must be "session". The engine fixture is session-scoped so the schema is
# built once per run; if tests ran on per-function loops they would receive
# connections opened on the session loop and fail with "attached to a different
# loop" the moment they touch the database.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires a live database",
]
