# Render Blueprint for the Ignition backend API only.
#
# The two frontends (Ignition-AdminFrontend, Ignition-StudentDashboard) are
# deployed separately as their own static sites via the Render dashboard
# ("New +" → "Static Site"), not through this Blueprint — bundling everything
# into one Blueprint needs a paid multi-service plan tier this account doesn't
# have. This file only provisions Redis + the API.
#
# Deploy from the Render dashboard via "New +" → "Blueprint", pointing it at
# the Ignition-Backend repo (this file's home).
#
# Postgres is NOT defined here — Neon is external. Paste its connection string
# into DATABASE_URL when Render prompts for it during the first Blueprint sync
# (see the `sync: false` entries below).
#
# "ignition-api" becomes the default subdomain (ignition-api.onrender.com) and
# must be globally unique across all of Render, not just your account. If it's
# taken, rename it below.
#
# After creating the two static sites separately, come back and update
# CORS_ORIGINS below with their real onrender.com URLs (or custom domains),
# then redeploy the API — otherwise the browser will block their requests to it.

services:
  # ── Redis (rate limiting + dashboard cache) ─────────────────────────────────
  - type: keyvalue
    name: ignition-redis
    plan: starter
    region: oregon
    ipAllowList: [] # no public endpoint access; Render's private network can still reach it
    maxmemoryPolicy: allkeys-lru

  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: ignition-api
    runtime: docker
    repo: https://github.com/NlogN-Solution/Ignition-Backend.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # preDeployCommand (used below for migrations) needs a paid plan, not free
    region: oregon
    healthCheckPath: /api/v1/health
    # Runs once per deploy, before the new version takes traffic. If your plan
    # doesn't support this, drop it and instead run `alembic upgrade head`
    # manually from the Render Shell after each deploy that adds a migration.
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false # paste Neon's connection string here when prompted
      - key: JWT_SECRET_KEY
        generateValue: true # Render generates and stores a random 256-bit value
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "30"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ignition-redis
          property: connectionString
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: MAX_UPLOAD_SIZE_MB
        value: "25"
      - key: TIMEZONE
        value: Asia/Kathmandu
      # Placeholder — replace with the two static sites' real URLs once they
      # exist (see the note at the top of this file), then redeploy.
      - key: CORS_ORIGINS
        value: '["https://ignition-admin.onrender.com","https://ignition-student.onrender.com"]'
