[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os

# Overridden at runtime by migrations/env.py from app.core.config.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# `module` (python -m ruff) rather than `exec`: exec resolves `ruff` on PATH,
# which is not set when alembic is invoked as .venv/bin/alembic. The module
# runner uses the interpreter already running alembic, so it always finds it.
hooks = ruff
ruff.type = module
ruff.module = ruff
ruff.options = format REVISION_SCRIPT_FILENAME


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
